version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - gocritic
    - gosec
    - makezero
    - musttag
    - nilerr
    - nilnesserr
    - noctx
    - perfsprint
    - predeclared
    - reassign
    - sloglint
    - spancheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - usestdlibvars
    - wastedassign
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    sloglint:
      context: all
      no-global: all
      static-msg: true
      key-naming-case: snake
  exclusions:
    generated: strict
    rules:
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
