name: Attach SuperAgent UI to GitHub Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z GitHub Release tag to attach
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: superagent-ui-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  attach:
    name: Attach @superdurable/superagent-ui archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      - name: Verify release tag and commit
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release tag ${RELEASE_TAG} is not on main" >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Check static types
        run: npm run typecheck --workspace @superdurable/superagent-ui
      - name: Test package
        run: npm run test --workspace @superdurable/superagent-ui
      - name: Set package version from release tag
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          npm version "${release_version}" \
            --workspace @superdurable/superagent-ui \
            --no-git-tag-version \
            --allow-same-version \
            --ignore-scripts \
            --no-workspaces-update

          package_version="$(node --print "require('./packages/superagent-ui/package.json').version")"
          test "${package_version}" = "${release_version}"
      - name: Build release archive
        shell: bash
        run: |
          asset_directory="${RUNNER_TEMP}/superagent-ui-release"
          asset_name="superdurable-superagent-ui-${RELEASE_TAG#v}.tgz"
          mkdir -p "${asset_directory}"
          npm pack \
            --workspace @superdurable/superagent-ui \
            --pack-destination "${asset_directory}"
          test -f "${asset_directory}/${asset_name}"
      - name: Attach immutable archive
        shell: bash
        run: |
          asset_name="superdurable-superagent-ui-${RELEASE_TAG#v}.tgz"
          asset_path="${RUNNER_TEMP}/superagent-ui-release/${asset_name}"
          existing_directory="${RUNNER_TEMP}/existing-superagent-ui-release"

          if gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name' |
            grep --fixed-strings --line-regexp --quiet "${asset_name}"; then
            mkdir -p "${existing_directory}"
            gh release download "${RELEASE_TAG}" \
              --pattern "${asset_name}" \
              --dir "${existing_directory}"
            if ! cmp --silent "${asset_path}" "${existing_directory}/${asset_name}"; then
              echo "Release asset ${asset_name} already exists with different contents" >&2
              exit 1
            fi
            echo "Release asset ${asset_name} already contains the expected archive"
          else
            gh release upload "${RELEASE_TAG}" "${asset_path}"
          fi

          install_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${asset_name}"
          echo "Install with: npm install ${install_url} react" >> "${GITHUB_STEP_SUMMARY}"

  notify-downstreams:
    name: Request IaC and SuperVerse upgrades
    if: github.event_name == 'release'
    needs: attach
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release compatibility declaration
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 script/check_dex_release.py
          python3 - "${RELEASE_TAG}" "${GITHUB_OUTPUT}" <<'PY'
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys

          tag, output_path = sys.argv[1:]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit("SuperAgent release tag is not stable semver")
          lock = json.loads(Path("dex-release.lock.json").read_text(encoding="utf-8"))
          commit = subprocess.run(
              ["git", "rev-parse", "HEAD"], check=True, capture_output=True, text=True
          ).stdout.strip()
          with Path(output_path).open("a", encoding="utf-8") as output:
              for name, value in {
                  "dex_version": lock["release"],
                  "manifest_url": lock["manifest"]["url"],
                  "manifest_sha256": lock["manifest"]["sha256"],
                  "open_flows_compatibility": lock["openFlowsCompatibility"],
                  "superagent_commit": commit,
              }.items():
                  print(f"{name}={value}", file=output)
          PY
      - name: Create repository-scoped release automation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          owner: superdurable
          repositories: iac,superverse
      - name: Dispatch audited downstream upgrades
        env:
          DEX_MANIFEST_SHA256: ${{ steps.release.outputs.manifest_sha256 }}
          DEX_MANIFEST_URL: ${{ steps.release.outputs.manifest_url }}
          DEX_VERSION: ${{ steps.release.outputs.dex_version }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OPEN_FLOWS_COMPATIBILITY: ${{ steps.release.outputs.open_flows_compatibility }}
          SUPERAGENT_COMMIT: ${{ steps.release.outputs.superagent_commit }}
          SUPERAGENT_RELEASE: ${{ github.event.release.tag_name }}
        run: |
          for repository in iac superverse; do
            gh api --method POST "repos/superdurable/${repository}/dispatches" \
              -f event_type=superagent-release-published \
              -f "client_payload[dex_version]=${DEX_VERSION}" \
              -f "client_payload[manifest_url]=${DEX_MANIFEST_URL}" \
              -f "client_payload[manifest_sha256]=${DEX_MANIFEST_SHA256}" \
              -f "client_payload[superagent_release]=${SUPERAGENT_RELEASE}" \
              -f "client_payload[superagent_commit]=${SUPERAGENT_COMMIT}" \
              -f "client_payload[open_flows_compatibility]=${OPEN_FLOWS_COMPATIBILITY}"
          done
