openapi: 3.0.3
info:
  title: Superagent API
  version: 0.2.0
  description: >-
    Phase 2 command, atomic Snapshot, queue mutation, and live-event contract
    for the durable AI Agent.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report process liveness
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report dependency readiness
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/portal:
    get:
      operationId: getPortal
      summary: Return provider and tool choices for the launch portal
      responses:
        "200":
          description: Launch configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portal"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/start:
    post:
      operationId: startAgent
      summary: Start one durable Agent Flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartAgentRequest"
      responses:
        "201":
          description: The Agent Flow was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartAgentResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/messages:
    post:
      operationId: sendMessage
      summary: Queue a user message or answer pending user input
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "202":
          description: The command was durably accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/snapshot:
    get:
      operationId: getAgentSnapshot
      summary: Read one atomic durable Agent application view
      parameters:
        - name: flowId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FlowId"
        - name: beforeSequence
          in: query
          required: false
          schema:
            allOf:
              - $ref: "#/components/schemas/Sequence"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: One atomic durable application Snapshot.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSnapshot"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/message-queue/delete:
    post:
      operationId: deleteQueuedMessage
      summary: Delete one exact pending queued user message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueMutationRequest"
      responses:
        "200":
          description: The queued message was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueMutationResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/message-queue/steer:
    post:
      operationId: steerQueuedMessage
      summary: Atomically move one queued user message into steering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueMutationRequest"
      responses:
        "200":
          description: The queued message was moved into steering.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueMutationResponse"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/plans/execute:
    post:
      operationId: executePlan
      summary: Execute one exact durable plan revision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutePlanRequest"
      responses:
        "202":
          description: The plan execution was durably accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/tool-approvals:
    post:
      operationId: approveTool
      summary: Resolve one exact pending tool approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToolApprovalRequest"
      responses:
        "202":
          description: The approval decision was durably accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /products/ai-agent/events:
    get:
      operationId: readEvent
      summary: Long-poll one best-effort Agent Stream
      description: >-
        Waits for one event for up to the server's bounded long-poll timeout.
        A 504 response means no event arrived and is safe to retry with the
        same resume token. Streams are live hints, never a durable state source.
      parameters:
        - name: flowId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/FlowId"
        - name: stream
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/EventStream"
        - name: resumeToken
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ResumeToken"
      responses:
        "200":
          description: One live event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamEvent"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "504":
          description: No event arrived before the bounded long-poll timeout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PollTimeout"
        "503":
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: The request could not be completed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    FlowId:
      type: string
      minLength: 1
      maxLength: 255
      x-ogen-name: FlowID
    CallId:
      type: string
      minLength: 1
      maxLength: 255
      x-ogen-name: CallID
    RunId:
      type: string
      minLength: 1
      maxLength: 255
      x-ogen-name: RunID
    MessageId:
      type: string
      minLength: 1
      maxLength: 255
      x-ogen-name: MessageID
    Sequence:
      type: integer
      format: int64
      minimum: 1
      maximum: 9007199254740991
    ResumeToken:
      type: string
      maxLength: 4096
    ToolName:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9_]+$"
    Provider:
      type: string
      enum:
        - mock
        - openai
        - anthropic
        - gemini
        - groq
    EventStream:
      type: string
      enum:
        - reasoning
        - assistant
        - activity
    EventKind:
      type: string
      enum:
        - plan_started
        - plan_updated
        - steering_applied
        - compaction_failed
        - compacted
        - model_started
        - model_failed
        - model_completed
        - model_tool_call
        - user_input_requested
        - tool_progress
        - tool_failed
        - tool_completed
    AgentStatus:
      type: string
      enum:
        - initializing
        - waiting_for_message
        - compacting_context
        - calling_model
        - routing_tool
        - waiting_for_tool_approval
        - executing_tool
        - waiting_for_timer
        - applying_steering
    MessageRole:
      type: string
      enum:
        - system
        - user
        - assistant
        - tool
    PlanStatus:
      type: string
      enum:
        - draft
        - active
        - completed
    TaskStatus:
      type: string
      enum:
        - pending
        - in_progress
        - completed
    QueueAction:
      type: string
      enum:
        - deleted
        - steered
    PollTimeoutReason:
      type: string
      enum:
        - timeout
    HealthStatus:
      type: string
      enum:
        - ok
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
    Portal:
      type: object
      additionalProperties: false
      required:
        - providers
        - mcpServers
        - tools
        - builtInTools
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/PortalProvider"
        mcpServers:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/PortalTool"
        builtInTools:
          type: array
          items:
            $ref: "#/components/schemas/ToolName"
    PortalProvider:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - modelPrefix
        - defaultModel
        - credentialEnvironmentVariable
        - configured
      properties:
        id:
          $ref: "#/components/schemas/Provider"
        label:
          type: string
          minLength: 1
        modelPrefix:
          type: string
        defaultModel:
          type: string
          minLength: 1
        credentialEnvironmentVariable:
          type: string
          nullable: true
        configured:
          type: boolean
    PortalTool:
      type: object
      additionalProperties: false
      required:
        - name
        - description
        - requiresApproval
        - server
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        description:
          type: string
        requiresApproval:
          type: boolean
        server:
          type: string
          minLength: 1
          nullable: true
    StartAgentRequest:
      type: object
      additionalProperties: false
      required:
        - flowId
        - provider
        - model
        - systemPrompt
        - maxContextTokens
        - messageRetentionLimit
        - mcpEnabled
        - enabledMcpServers
        - enabledTools
      properties:
        flowId:
          $ref: "#/components/schemas/FlowId"
        provider:
          $ref: "#/components/schemas/Provider"
        model:
          type: string
          minLength: 1
          maxLength: 255
        systemPrompt:
          type: string
          minLength: 1
          maxLength: 100000
        compactionModel:
          type: string
          minLength: 1
          maxLength: 255
          nullable: true
        maxContextTokens:
          type: integer
          minimum: 1
          maximum: 2000000
        compactionTriggerFraction:
          type: number
          format: double
          minimum: 0
          maximum: 1
          exclusiveMinimum: true
          exclusiveMaximum: true
          default: 0.85
        compactionKeepFraction:
          type: number
          format: double
          minimum: 0
          maximum: 1
          exclusiveMinimum: true
          exclusiveMaximum: true
          default: 0.1
        messageRetentionLimit:
          type: integer
          minimum: 1
          maximum: 1000000
        mcpEnabled:
          type: boolean
        enabledMcpServers:
          type: array
          uniqueItems: true
          maxItems: 1000
          items:
            type: string
            minLength: 1
        enabledTools:
          type: array
          uniqueItems: true
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ToolName"
    StartAgentResponse:
      type: object
      additionalProperties: false
      required:
        - flowId
      properties:
        flowId:
          $ref: "#/components/schemas/FlowId"
    SendMessageRequest:
      type: object
      additionalProperties: false
      required:
        - flowId
        - content
        - planMode
      properties:
        flowId:
          $ref: "#/components/schemas/FlowId"
        content:
          type: string
          minLength: 1
          maxLength: 1000000
        planMode:
          type: boolean
    ExecutePlanRequest:
      type: object
      additionalProperties: false
      required:
        - flowId
        - revision
      properties:
        flowId:
          $ref: "#/components/schemas/FlowId"
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    ToolApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - flowId
        - callId
        - approved
      properties:
        flowId:
          $ref: "#/components/schemas/FlowId"
        callId:
          $ref: "#/components/schemas/CallId"
        approved:
          type: boolean
    QueueMutationRequest:
      type: object
      additionalProperties: false
      required:
        - flowId
        - messageId
      properties:
        flowId:
          $ref: "#/components/schemas/FlowId"
        messageId:
          $ref: "#/components/schemas/MessageId"
    QueueMutationResponse:
      type: object
      additionalProperties: false
      required:
        - messageId
        - action
      properties:
        messageId:
          $ref: "#/components/schemas/MessageId"
        action:
          $ref: "#/components/schemas/QueueAction"
    AgentSnapshot:
      type: object
      additionalProperties: false
      required:
        - runId
        - flowStatus
        - errorType
        - errorMessage
        - history
        - description
        - queued
        - steered
      properties:
        runId:
          $ref: "#/components/schemas/RunId"
        flowStatus:
          $ref: "#/components/schemas/FlowStatus"
        errorType:
          allOf:
            - $ref: "#/components/schemas/FlowErrorType"
          nullable: true
        errorMessage:
          type: string
          nullable: true
        history:
          $ref: "#/components/schemas/HistoryPage"
        description:
          allOf:
            - $ref: "#/components/schemas/AgentDescription"
          nullable: true
        queued:
          type: array
          items:
            $ref: "#/components/schemas/PendingUserMessage"
        steered:
          type: array
          items:
            $ref: "#/components/schemas/PendingUserMessage"
    HistoryPage:
      type: object
      additionalProperties: false
      required:
        - messages
        - nextBeforeSequence
      properties:
        messages:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/SequencedMessage"
        nextBeforeSequence:
          allOf:
            - $ref: "#/components/schemas/Sequence"
          nullable: true
    FlowStatus:
      type: string
      enum:
        - running
        - completed
        - failed
        - terminated
        - canceled
        - continued_as_new
    FlowErrorType:
      type: string
      enum:
        - step_decision
        - client_api
        - worker_method
        - invalid_user_code
        - internal
        - timeout
    SequencedMessage:
      type: object
      additionalProperties: false
      required:
        - sequence
        - message
      properties:
        sequence:
          $ref: "#/components/schemas/Sequence"
        message:
          $ref: "#/components/schemas/AgentMessage"
    AgentMessage:
      type: object
      additionalProperties: false
      required:
        - role
        - content
        - toolCalls
        - toolCallId
        - toolName
        - createdAt
      properties:
        role:
          $ref: "#/components/schemas/MessageRole"
        content:
          type: string
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
        toolCallId:
          allOf:
            - $ref: "#/components/schemas/CallId"
          nullable: true
        toolName:
          allOf:
            - $ref: "#/components/schemas/ToolName"
          nullable: true
        createdAt:
          type: string
          format: date-time
    ToolCall:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - argumentsJson
      properties:
        id:
          $ref: "#/components/schemas/CallId"
        name:
          $ref: "#/components/schemas/ToolName"
        argumentsJson:
          type: string
          minLength: 2
    PendingUserMessage:
      type: object
      additionalProperties: false
      required:
        - messageId
        - value
      properties:
        messageId:
          $ref: "#/components/schemas/MessageId"
        value:
          $ref: "#/components/schemas/UserMessage"
    UserMessage:
      type: object
      additionalProperties: false
      required:
        - content
        - planMode
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000000
        planMode:
          type: boolean
    AgentDescription:
      type: object
      additionalProperties: false
      required:
        - status
        - model
        - systemPrompt
        - firstRetainedSequence
        - lastSequence
        - summarizedThroughSequence
        - pendingApproval
        - pendingTimer
        - pendingUserInput
        - plan
        - isPlanExecutionRequested
        - pendingQueuedMessageCount
        - pendingSteeredMessageCount
        - availableMcpServers
        - availableTools
      properties:
        status:
          $ref: "#/components/schemas/AgentStatus"
        model:
          type: string
        systemPrompt:
          type: string
        firstRetainedSequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        lastSequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        summarizedThroughSequence:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        pendingApproval:
          allOf:
            - $ref: "#/components/schemas/PendingApproval"
          nullable: true
        pendingTimer:
          allOf:
            - $ref: "#/components/schemas/PendingTimer"
          nullable: true
        pendingUserInput:
          allOf:
            - $ref: "#/components/schemas/PendingUserInput"
          nullable: true
        plan:
          allOf:
            - $ref: "#/components/schemas/AgentPlan"
          nullable: true
        isPlanExecutionRequested:
          type: boolean
        pendingQueuedMessageCount:
          type: integer
          minimum: 0
        pendingSteeredMessageCount:
          type: integer
          minimum: 0
        availableMcpServers:
          type: array
          items:
            type: string
            minLength: 1
        availableTools:
          type: array
          items:
            $ref: "#/components/schemas/ToolName"
    PendingApproval:
      type: object
      additionalProperties: false
      required:
        - callId
        - toolName
        - argumentsJson
      properties:
        callId:
          $ref: "#/components/schemas/CallId"
        toolName:
          $ref: "#/components/schemas/ToolName"
        argumentsJson:
          type: string
          minLength: 2
    PendingTimer:
      type: object
      additionalProperties: false
      required:
        - callId
        - durationSeconds
        - reason
      properties:
        callId:
          $ref: "#/components/schemas/CallId"
        durationSeconds:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
    PendingUserInput:
      type: object
      additionalProperties: false
      required:
        - callId
        - prompt
        - choices
      properties:
        callId:
          $ref: "#/components/schemas/CallId"
        prompt:
          type: string
          minLength: 1
        choices:
          type: array
          items:
            type: string
            minLength: 1
    AgentPlan:
      type: object
      additionalProperties: false
      required:
        - revision
        - status
        - tasks
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        status:
          $ref: "#/components/schemas/PlanStatus"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/PlanTask"
    PlanTask:
      type: object
      additionalProperties: false
      required:
        - content
        - status
      properties:
        content:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TaskStatus"
    Accepted:
      type: object
      additionalProperties: false
      required:
        - accepted
      properties:
        accepted:
          type: boolean
          enum:
            - true
    PollTimeout:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          $ref: "#/components/schemas/PollTimeoutReason"
    StreamEvent:
      oneOf:
        - $ref: "#/components/schemas/ReasoningStreamEvent"
        - $ref: "#/components/schemas/AssistantStreamEvent"
        - $ref: "#/components/schemas/ActivityStreamEvent"
      discriminator:
        propertyName: kind
        mapping:
          reasoning_summary: "#/components/schemas/ReasoningStreamEvent"
          assistant_text: "#/components/schemas/AssistantStreamEvent"
          activity: "#/components/schemas/ActivityStreamEvent"
    ReasoningStreamEvent:
      allOf:
        - $ref: "#/components/schemas/TextStreamEvent"
        - type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - reasoning_summary
    AssistantStreamEvent:
      allOf:
        - $ref: "#/components/schemas/TextStreamEvent"
        - type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - assistant_text
    TextStreamEvent:
      type: object
      additionalProperties: false
      required:
        - value
        - resumeToken
        - createdAt
        - source
      properties:
        value:
          type: string
        resumeToken:
          $ref: "#/components/schemas/ResumeToken"
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          minLength: 1
    ActivityStreamEvent:
      type: object
      additionalProperties: false
      required:
        - kind
        - value
        - resumeToken
        - createdAt
        - source
      properties:
        kind:
          type: string
          enum:
            - activity
        value:
          $ref: "#/components/schemas/AgentEvent"
        resumeToken:
          $ref: "#/components/schemas/ResumeToken"
        createdAt:
          type: string
          format: date-time
        source:
          type: string
          minLength: 1
    AgentEvent:
      type: object
      additionalProperties: false
      required:
        - kind
        - message
        - callId
        - toolName
        - messageSequence
      properties:
        kind:
          $ref: "#/components/schemas/EventKind"
        message:
          type: string
        callId:
          allOf:
            - $ref: "#/components/schemas/CallId"
          nullable: true
        toolName:
          allOf:
            - $ref: "#/components/schemas/ToolName"
          nullable: true
        messageSequence:
          description: Durable assistant message produced by this model invocation, or null for unrelated activity.
          allOf:
            - $ref: "#/components/schemas/Sequence"
          nullable: true
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
